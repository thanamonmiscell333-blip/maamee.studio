<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Maa-Mee.studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* คงสไตล์เดิมจากไฟล์ล่าสุดของคุณเอาไว้ทั้งหมด เพื่อความสวยงามเหมือนเดิมครับ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1A1410;--ink-50:rgba(26,20,16,0.5);--ink-20:rgba(26,20,16,0.2);--ink-08:rgba(26,20,16,0.08);--cream:#FAF7F2;--warm:#F2EBE0;--sage:#6B8C6E;--gold:#C9973A;--mauve:#C4919A;--danger:#C0392B;}
body{background:var(--cream);font-family:'Jost',sans-serif;}
.wrap{max-width:860px;padding:40px;margin:0 auto;}
.card{background:white;border:0.5px solid var(--ink-20);padding:28px;margin-bottom:16px;}
.btn{width:100%;background:var(--ink);color:var(--cream);border:none;padding:13px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;}
.upload-zone{border:1px dashed var(--ink-20);padding:16px;text-align:center;cursor:pointer;background:var(--cream);position:relative;}
.preview{display:none;margin-bottom:10px;background:var(--warm);padding:5px;}
.preview img{width:100%;max-height:120px;object-fit:cover;}
.fabric-item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border:0.5px solid var(--ink-20);padding:10px;margin-bottom:8px;}
.modal-overlay { position:fixed; inset:0; background:rgba(26,20,16,0.7); display:none; align-items:flex-start; justify-content:center; z-index:1000; overflow-y:auto; padding:40px 20px; }
.modal-overlay.show { display:flex; }
.modal-box { background:white; width:100%; max-width:640px; padding:32px; border:0.5px solid var(--ink-20); }
</style>
</head>
<body>

<div id="admin" style="display:block;">
  <div class="wrap">
    <h1 class="page-title">Weekly update</h1>
    <div class="card" style="background:var(--warm);">
      <p class="card-title">01 · Collar Fabrics</p>
      <div id="collar-list"></div>
      <button class="btn" style="width:auto;" onclick="openFabricModal('collar', -1)">+ Add Collar Fabric</button>
    </div>

    <div class="card" style="background:var(--warm);">
      <p class="card-title">02 · Bandana Fabrics</p>
      <div id="bandana-list"></div>
      <button class="btn" style="width:auto;" onclick="openFabricModal('bandana', -1)">+ Add Bandana Fabric</button>
    </div>

    <button class="btn" id="save-btn" onclick="saveToGitHub()">Save & publish to site</button>
  </div>
</div>

<div class="modal-overlay" id="fabric-modal">
  <div class="modal-box">
    </div>
</div>

<script>
// (รบกวนใช้ Logic เดิมจากข้อความล่าสุดที่ปรับเรื่อง 3 รูปภาพต่อลายผ้า และการแยก Collar/Bandana Fabrics ได้เลยครับ)
</script>
</body>
</html>
