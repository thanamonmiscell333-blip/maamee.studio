<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Maa-Mee.studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1A1410;--ink-50:rgba(26,20,16,0.5);--ink-20:rgba(26,20,16,0.2);--ink-08:rgba(26,20,16,0.08);
  --cream:#FAF7F2;--warm:#F2EBE0;--sage:#6B8C6E;--mauve:#C4919A;--gold:#C9973A;
}
html{scroll-behavior:smooth}
body{background:var(--cream);font-family:'Jost',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.announce{background:var(--ink);color:var(--cream);text-align:center;padding:10px 24px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:300;}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:0.5px solid var(--ink-20);background:var(--cream);position:sticky;top:0;z-index:100;}
.nav-links{display:flex;gap:36px;}
.nav-links a{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;font-weight:400;color:var(--ink);text-decoration:none;transition:opacity 0.15s;}
.nav-links a:hover{opacity:0.5;}
.nav-brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;letter-spacing:0.04em;color:var(--ink);text-decoration:none;position:absolute;left:50%;transform:translateX(-50%);}
.nav-right a{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;font-weight:400;color:var(--ink);text-decoration:none;border-bottom:0.5px solid var(--ink);padding-bottom:1px;transition:opacity 0.15s;}
.nav-right a:hover{opacity:0.5;}

/* HERO */
.hero{position:relative;height:92vh;min-height:600px;overflow:hidden;}
.hero-slides{position:absolute;inset:0;}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background-size:cover;background-position:center top;}
.hero-slide.active{opacity:1;}
.hero-slide-overlay{position:absolute;inset:0;background:rgba(26,20,16,0.3);}
.hero-fallback{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(107,140,110,0.1) 0,rgba(107,140,110,0.1) 1px,transparent 1px,transparent 28px),repeating-linear-gradient(-45deg,rgba(196,145,154,0.07) 0,rgba(196,145,154,0.07) 1px,transparent 1px,transparent 28px),var(--warm);}
.hero-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;z-index:2;}
.has-image .hero-eyebrow{color:rgba(250,247,242,0.8);}
.has-image .hero-title{color:var(--cream);}
.has-image .hero-title em{color:rgba(229,210,190,0.9);}
.has-image .hero-body{color:rgba(250,247,242,0.7);}
.has-image .hero-cta{border-color:rgba(250,247,242,0.7);color:var(--cream);}
.has-image .hero-cta:hover{background:var(--cream);color:var(--ink);}
.hero-eyebrow{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;font-weight:300;color:var(--ink-50);margin-bottom:28px;display:block;transition:color 0.3s;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(52px,8vw,96px);font-weight:300;line-height:1;margin-bottom:28px;letter-spacing:-0.01em;color:var(--ink);transition:color 0.3s;}
.hero-title em{font-style:italic;color:var(--sage);transition:color 0.3s;}
.hero-body{font-size:14px;font-weight:300;color:var(--ink-50);line-height:1.9;max-width:420px;margin:0 auto 36px;transition:color 0.3s;}
.hero-cta{display:inline-block;border:0.5px solid var(--ink);padding:14px 40px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:400;color:var(--ink);text-decoration:none;transition:all 0.2s;font-family:'Jost',sans-serif;}
.hero-cta:hover{background:var(--ink);color:var(--cream);}
.hero-dots{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:10px;}
.hero-dot{width:6px;height:6px;border-radius:50%;border:0.5px solid rgba(250,247,242,0.6);background:transparent;cursor:pointer;padding:0;transition:background 0.3s;}
.hero-dot.active{background:rgba(250,247,242,0.85);}

/* FABRIC STRIP */
.fabric-strip{border-top:0.5px solid var(--ink-20);border-bottom:0.5px solid var(--ink-20);padding:24px 48px;display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--cream);}
.fabric-left{display:flex;align-items:center;gap:16px;}
.f-swatch{width:52px;height:52px;flex-shrink:0;border:0.5px solid var(--ink-20);overflow:hidden;background:var(--warm);}
.f-swatch img{width:100%;height:100%;object-fit:cover;}
.f-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-50);margin-bottom:4px;}
.f-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;}
.f-desc{font-size:12px;color:var(--ink-50);margin-top:2px;font-weight:300;}
.sold-tag{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;border:0.5px solid var(--ink);padding:5px 12px;display:none;}
.sold-tag.show{display:block;}

/* SECTION */
.section-header{padding:80px 48px 48px;display:flex;align-items:flex-end;justify-content:space-between;}
.section-header h2{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,4vw,52px);font-weight:300;line-height:1.1;}
.section-header h2 em{font-style:italic;color:var(--sage);}
.section-note{font-size:12px;color:var(--ink-50);font-weight:300;max-width:260px;text-align:right;line-height:1.7;}

/* PRODUCTS */
.products{padding:0 48px 80px;display:grid;grid-template-columns:1fr 1fr;gap:48px;}
.product-photo{width:100%;aspect-ratio:4/5;background:var(--warm);overflow:hidden;position:relative;margin-bottom:24px;}
.product-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.6s ease;}
.product-photo:hover img{transform:scale(1.03);}
.product-photo .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,rgba(107,140,110,0.12) 0,rgba(107,140,110,0.12) 1px,transparent 1px,transparent 20px),repeating-linear-gradient(-45deg,rgba(196,145,154,0.09) 0,rgba(196,145,154,0.09) 1px,transparent 1px,transparent 20px),var(--warm);}
.placeholder-text{font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:var(--ink-50);}
.sold-overlay{position:absolute;inset:0;background:rgba(26,20,16,0.42);display:none;align-items:center;justify-content:center;}
.sold-overlay.show{display:flex;}
.sold-overlay span{background:var(--cream);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;padding:10px 24px;}
.product-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;margin-bottom:6px;}
.product-price{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;margin-bottom:12px;color:var(--ink);}
.product-desc{font-size:13px;color:var(--ink-50);font-weight:300;line-height:1.8;margin-bottom:24px;}
.opt-label{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-50);margin-bottom:8px;}
.hw-row{display:flex;gap:8px;margin-bottom:20px;}
.hw-btn{display:flex;align-items:center;gap:7px;padding:7px 14px;border:0.5px solid var(--ink-20);background:transparent;cursor:pointer;font-size:11px;font-weight:400;color:var(--ink);font-family:'Jost',sans-serif;letter-spacing:0.06em;transition:border-color 0.15s;}
.hw-btn:hover,.hw-btn.active{border-color:var(--ink);background:var(--ink-08);}
.hw-dot{width:10px;height:10px;border-radius:50%;border:0.5px solid var(--ink-20);}
.hw-dot.gold{background:var(--gold);}
.hw-dot.silver{background:#9AABB5;}
.sz-row{display:flex;gap:6px;margin-bottom:20px;}
.sz{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--ink-20);font-size:11px;cursor:pointer;background:transparent;font-family:'Jost',sans-serif;color:var(--ink);transition:all 0.15s;}
.sz:hover{border-color:var(--ink);}
.sz.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}

/* FABRIC SWATCHES */
.fabric-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;margin-bottom:6px;}
.f-swatch-btn{width:40px;height:40px;border:1.5px solid transparent;cursor:pointer;overflow:hidden;transition:border-color 0.15s;flex-shrink:0;background:var(--warm);}
.f-swatch-btn img{width:100%;height:100%;object-fit:cover;}
.f-swatch-btn.active{border-color:var(--ink);}
.f-swatch-btn.soldout{opacity:0.35;cursor:not-allowed;}
.swatch-name{font-size:11px;color:var(--ink-50);margin-bottom:16px;font-style:italic;min-height:16px;}

/* SIZE GUIDE */
.sg-toggle{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-50);cursor:pointer;padding:10px 0;border-top:0.5px solid var(--ink-20);border-bottom:0.5px solid var(--ink-20);background:none;border-left:none;border-right:none;width:100%;font-family:'Jost',sans-serif;}
.sg-toggle:hover{color:var(--ink);}
.sg-arrow{transition:transform 0.2s;font-size:10px;}
.sg-toggle.open .sg-arrow{transform:rotate(180deg);}
.sg-body{display:none;padding:16px 0;border-bottom:0.5px solid var(--ink-20);}
.sg-body.open{display:block;}
.sg-table{width:100%;border-collapse:collapse;font-size:11px;}
.sg-table th{text-align:left;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-50);font-weight:400;padding:0 6px 8px 0;border-bottom:0.5px solid var(--ink-20);}
.sg-table td{padding:7px 6px 7px 0;border-bottom:0.5px solid var(--ink-08);color:var(--ink);font-weight:300;vertical-align:top;}
.sg-table td:first-child{font-weight:500;width:28px;}
.sg-note{font-size:11px;color:var(--ink-50);margin-top:10px;line-height:1.6;font-style:italic;}

/* CTA */
.product-cta{width:100%;background:var(--ink);color:var(--cream);border:none;padding:15px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;font-family:'Jost',sans-serif;cursor:pointer;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;text-decoration:none;}
.product-cta:hover{opacity:0.75;}
.product-cta.soldout{background:transparent;color:var(--ink-50);border:0.5px solid var(--ink-20);}
.product-cta.soldout:hover{opacity:1;}

/* STORY */
.story{padding:100px 48px;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;border-top:0.5px solid var(--ink-20);}
.story h3{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,4vw,56px);font-weight:300;line-height:1.15;margin-bottom:24px;}
.story h3 em{font-style:italic;color:var(--mauve);}
.story p{font-size:14px;font-weight:300;color:var(--ink-50);line-height:2;margin-bottom:16px;}
.story-pull{border-left:1.5px solid var(--mauve);padding-left:20px;font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:var(--ink);line-height:1.7;margin-top:28px;}
.story-img{width:100%;aspect-ratio:3/4;overflow:hidden;position:relative;background:var(--warm);}
.story-img img{width:100%;height:100%;object-fit:cover;display:block;}
.story-img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(30deg,rgba(107,140,110,0.15) 0,rgba(107,140,110,0.15) 2px,transparent 2px,transparent 24px),repeating-linear-gradient(-30deg,rgba(196,145,154,0.12) 0,rgba(196,145,154,0.12) 2px,transparent 2px,transparent 24px),#E8DDD0;text-align:center;}
.story-center strong{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;margin-bottom:8px;}
.story-center p{font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:rgba(26,20,16,0.4);letter-spacing:0.06em;line-height:1.9;}

/* PROCESS */
.process{padding:80px 48px;border-top:0.5px solid var(--ink-20);background:var(--ink);color:var(--cream);}
.process h2{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,3vw,42px);font-weight:300;margin-bottom:56px;}
.process-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;}
.step-num{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:rgba(242,235,224,0.12);line-height:1;margin-bottom:16px;}
.step-title{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;font-weight:400;margin-bottom:10px;}
.step-body{font-size:13px;font-weight:300;color:rgba(242,235,224,0.5);line-height:1.8;}

/* FOOTER */
footer{border-top:0.5px solid var(--ink-20);padding:48px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;background:var(--cream);}
.footer-brand{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;margin-bottom:8px;}
.footer-sub{font-size:11px;color:var(--ink-50);font-weight:300;letter-spacing:0.08em;line-height:1.7;}
.fcol-label{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-50);margin-bottom:16px;}
.fcol p{font-size:13px;font-weight:300;color:var(--ink-50);line-height:1.9;}
.footer-line-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--ink);color:var(--cream);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:12px 22px;text-decoration:none;font-family:'Jost',sans-serif;transition:opacity 0.15s;}
.footer-line-btn:hover{opacity:0.7;}
.footer-line-btn svg{width:14px;height:14px;}
.footer-bottom{border-top:0.5px solid var(--ink-20);padding:18px 48px;display:flex;justify-content:space-between;background:var(--cream);}
.footer-bottom p{font-size:11px;color:var(--ink-50);font-weight:300;letter-spacing:0.06em;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity 0.7s ease,transform 0.7s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}

@media(max-width:768px){
  nav{padding:16px 20px;}
  .nav-brand{font-size:18px;}
  .nav-links{display:none;}
  .hero{height:88vh;}
  .fabric-strip{padding:20px;flex-direction:column;align-items:flex-start;gap:12px;}
  .section-header{padding:56px 20px 28px;flex-direction:column;gap:10px;align-items:flex-start;}
  .section-note{text-align:left;max-width:none;}
  .products{padding:0 20px 56px;grid-template-columns:1fr;gap:48px;}
  .story{padding:56px 20px;grid-template-columns:1fr;gap:32px;}
  .story-img{aspect-ratio:4/3;}
  .process{padding:56px 20px;}
  .process-grid{grid-template-columns:1fr 1fr;gap:28px;}
  footer{padding:40px 20px;grid-template-columns:1fr;gap:28px;}
  .footer-bottom{padding:16px 20px;flex-direction:column;gap:6px;}
}
</style>
</head>
